name: Update stats cards

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=samba-gomis&show_icons=true&bg_color=0d1117&border_color=2563eb&title_color=93c5fd&icon_color=93c5fd&text_color=c9d1d9&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=samba-gomis&layout=compact&bg_color=0d1117&border_color=2563eb&title_color=93c5fd&text_color=c9d1d9&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=samba-gomis&background=0d1117&border=2563eb&ring=93c5fd&fire=93c5fd&currStreakLabel=93c5fd&currStreakNum=ffffff&sideLabels=c9d1d9&sideNums=c9d1d9&dates=8b949e&hide_border=false&disable_animations=true"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour."
          else
            git commit -m "chore: mise à jour automatique des cartes stats"
            git push
          fi
